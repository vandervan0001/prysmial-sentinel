name: Validate library

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test tools, evidence contracts and synthetic review
        run: python -B -m unittest discover -s tests -v
      - name: Validate catalogue and imported file integrity
        run: python scripts/validate_library.py
      - name: Build and verify release archive
        run: python scripts/package_library.py build --out-dir "${{ runner.temp }}/sentinel-release"
